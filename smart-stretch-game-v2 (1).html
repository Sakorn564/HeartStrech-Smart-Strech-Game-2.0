  useEffect(() => {

    }, 1500);
    return ()=>clearInterval(simRef.current);
  }, [mode]);

  useEffect(()=>{setHRHist(h=>[...h.slice(-19),dHR]);},[dHR]);

  useEffect(()=>{

    }
    return()=>clearInterval(sittingRef.current);
  },[isConn,mode]);

  const parseHR = useCallback((e)=>{const v=e.target.value,f=v.getUint8(0);setHR((f&0x1)?v.getUint16(1,true):v.getUint8(1));},[]);

  const connectBLE = async()=>{
    if(!navigator.bluetooth){setBleState(BLE.UNSUPPORTED);setBleError("ใช้ Chrome/Edge บน Desktop หรือ Android");return;}
    try{
      setBleState(BLE.SCANNING);setBleError("");
      const dev=await navigator.bluetooth.requestDevice({filters:[{services:[HR_SERVICE]}],optionalServices:[0x180F,0x1800]});
      deviceRef.current=dev;setDeviceName(dev.name||"Smart Watch");setBleState(BLE.CONNECTING);
      dev.addEventListener("gattserverdisconnected",()=>{setBleState(BLE.IDLE);setHR(null);setDeviceName("");});
      const srv=await dev.gatt.connect();
      const hrsvc=await srv.getPrimaryService(HR_SERVICE);
      const hrch=await hrsvc.getCharacteristic(HR_MEASUREMENT);
      await hrch.startNotifications();hrch.addEventListener("characteristicvaluechanged",parseHR);
      try{const b=await(await(await srv.getPrimaryService(0x180F)).getCharacteristic(0x2A19)).readValue();setBattery(b.getUint8(0));}catch(_){}
      setBleState(BLE.CONNECTED);setSittingMin(0);
    }catch(err){if(err.name==="NotFoundError")setBleState(BLE.IDLE);else{setBleState(BLE.ERROR);setBleError(err.message||"เชื่อมต่อไม่สำเร็จ");}}
  };

  const disconnectBLE=()=>{
    if(deviceRef.current?.gatt?.connected)deviceRef.current.gatt.disconnect();
    setBleState(BLE.IDLE);setHR(null);setDeviceName("");setBattery(null);
  };

  useEffect(()=>{
    if(mode==="active"){
      const ex=selEx[curEx];setTimer(ex.dur);setExDone(false);clearInterval(gameRef.current);
      gameRef.current=setInterval(()=>{
        setTimer(t=>{
          if(t<=1){clearInterval(gameRef.current);setExDone(true);setTotalS(s=>s+1);const cal=Math.round(Math.random()*5+8);setCalories(c=>c+cal);setTotalCal(c=>c+cal);setSittingMin(0);setSittingAlert(false);
            setPainLog(p=>({...p,[selEx[curEx].id===1?"neck":selEx[curEx].id===2?"shoulder":selEx[curEx].id<=4?"back":selEx[curEx].id===8?"wrist":"leg"]:Math.max(0,p[selEx[curEx].id===1?"neck":selEx[curEx].id===2?"shoulder":selEx[curEx].id<=4?"back":selEx[curEx].id===8?"wrist":"leg"]-2)}));
            return 0;}
          setPoseS(Math.min(100,Math.round(60+Math.random()*40)));
          setMoveS(Math.min(100,Math.round(55+Math.random()*45)));
          setScore(s=>Math.min(100,s+0.3));return t-1;
        });
      },1000);
    }
    return()=>clearInterval(gameRef.current);
  },[mode,curEx]);

  // Eye rest 20-20-20
  const startEyeRest = ()=>{
    setEyeActive(true);setEyeTimer(20);
    eyeRef.current=setInterval(()=>{setEyeTimer(t=>{if(t<=1){clearInterval(eyeRef.current);setEyeActive(false);return 0;}return t-1;});},1000);
  };

  const startFull=()=>{setSelEx(exercises);setScore(0);setCalories(0);setPoseS(0);setMoveS(0);setExDone(false);setCurEx(0);setMode("active");setSittingAlert(false);};
  const startOne=(i)=>{setSelEx([exercises[i]]);setScore(0);setCalories(0);setPoseS(0);setMoveS(0);setExDone(false);setCurEx(0);setMode("active");setSittingAlert(false);};
  const nextEx=()=>{if(curEx<selEx.length-1){setCurEx(c=>c+1);setExDone(false);setScore(0);setPoseS(0);setMoveS(0);}else{setMode("done");}};

  const ex=selEx[curEx]||exercises[0];
  const hrInZone=dHR>=ex.hr[0]&&dHR<=ex.hr[1];
  const tScore=Math.round(poseS*0.4+moveS*0.25+(hrInZone?100:50)*0.2+(timer===0?100:((ex.dur-timer)/ex.dur)*100)*0.15);
  const hrMax=Math.max(...hrHist,1);

  const TABS = [
    {id:"home",label:"หน้าหลัก",icon:<IcoActivity s={14} c="inherit"/>},
    {id:"health",label:"สุขภาพ",icon:<IcoHeart s={14} c="inherit"/>},
    {id:"workout",label:"Workout",icon:<IcoZap s={14} c="inherit"/>},
    {id:"connect",label:"Watch",icon:<IcoWatch s={14} c="inherit"/>},
    {id:"social",label:"Social",icon:<IcoUsers s={14} c="inherit"/>},
  ];

  const Card=({children,style={}})=>(
    <div style={{background:C.surf,border:"1px solid #2A2A2C",borderRadius:16,padding:20,...style}}>{children}</div>
  );

  const SectionTitle=({icon,title,sub,action})=>(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {icon}
        <div>
          <div style={{fontSize:14,fontWeight:700,color:C.white}}>{title}</div>
          {sub&&<div style={{fontSize:11,color:C.gray}}>{sub}</div>}
        </div>
      </div>
      {action}
    </div>
  );

  return (
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"Arial,sans-serif",color:C.white}}>
      <style>{`
        @keyframes pulse{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(1.8);opacity:0}}
        @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes glow{0%,100%{box-shadow:0 0 8px #E5002F44}50%{box-shadow:0 0 28px #E5002F88}}
        .card:hover{border-color:#E5002F40!important;transition:border-color 0.2s;}
        .ex-card{transition:all 0.18s;cursor:pointer;}
        .ex-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,0.5);}
        .btn{transition:all 0.15s;cursor:pointer;}
        .btn:hover{opacity:0.85;transform:translateY(-1px);}
        ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:#131314;} ::-webkit-scrollbar-thumb{background:#333;}
      `}</style>

      {/* ── HEADER ── */}
      <div style={{background:"linear-gradient(180deg,#110008,#0A0005)",borderBottom:"1px solid #2A0A10",position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1060,margin:"0 auto",padding:"0 22px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",height:58}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <HeartLogo size={36}/>
              <div>
                <div style={{display:"flex",alignItems:"baseline",gap:1}}>
                  <span style={{...gRed,fontSize:20,fontWeight:900}}>Heart</span>
                  <span style={{color:C.white,fontSize:20,fontWeight:900}}>Stretch</span>
                  <span style={{fontSize:10,color:"#9A4060",marginLeft:6,letterSpacing:1,fontWeight:600}}>OFFICE CARE</span>
                </div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {/* HR live */}
              <div style={{display:"flex",alignItems:"center",gap:6,background:isConn?"#200008":"#1A1A1A",border:`1px solid ${isConn?"#E5002F50":"#333"}`,borderRadius:22,padding:"5px 14px"}}>
                <div style={{animation:"beat 1s infinite",display:"flex"}}><IcoHeart s={14}/></div>
                <span style={{fontSize:16,fontWeight:700,color:C.red}}>{Math.round(dHR)}</span>
                <span style={{fontSize:10,color:C.gray}}>bpm</span>
                <div style={{width:1,height:12,background:"#333"}}/>
                <span style={{fontSize:10,fontWeight:600,color:isConn?C.teal:C.gray}}>{isConn?"LIVE":"SIM"}</span>
              </div>
              {/* notification bell */}
              <div className="btn" onClick={()=>setTab("health")} style={{position:"relative",background:C.surf,border:"1px solid #333",borderRadius:"50%",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <IcoBell s={16}/>
                {unread>0&&<div style={{position:"absolute",top:4,right:4,width:8,height:8,borderRadius:"50%",background:C.red}}/>}
              </div>
              {/* connect btn */}
              <button className="btn" onClick={()=>setTab("connect")}
                style={{display:"flex",alignItems:"center",gap:6,background:isConn?"#200008":"linear-gradient(90deg,#E5002F,#FCA91A)",border:isConn?"1px solid #E5002F":"none",color:isConn?C.red:"#fff",borderRadius:22,padding:"7px 16px",fontSize:12,fontWeight:700}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:isConn?C.teal:bleState===BLE.SCANNING?C.orange:"#fff",animation:isConn?"pulse 1.4s infinite":"none"}}/>
                {isConn?deviceName:bleState===BLE.SCANNING?"สแกน...":bleState===BLE.CONNECTING?"เชื่อมต่อ...":"Connect Watch"}
              </button>
            </div>
          </div>
          {/* Tabs */}
          <div style={{display:"flex",gap:0}}>
            {TABS.map(t=>(
              <button key={t.id} className="btn" onClick={()=>{setTab(t.id);if(t.id==="workout")setMode("select");}}
                style={{display:"flex",alignItems:"center",gap:5,background:"transparent",border:"none",borderBottom:tab===t.id?"2px solid #E5002F":"2px solid transparent",color:tab===t.id?C.white:C.gray,padding:"9px 16px",fontSize:12,fontWeight:tab===t.id?700:400}}>
                <span style={{color:tab===t.id?C.red:C.gray}}>{t.icon}</span>{t.label}
              </button>
            ))}
            <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center",paddingBottom:4}}>
              <div style={{background:"#200008",border:"1px solid #E5002F30",borderRadius:16,padding:"3px 10px",fontSize:11,color:C.red,fontWeight:700}}>🔥 {totalS} ท่า</div>
              <div style={{background:"#1A0D00",border:`1px solid ${C.orange}30`,borderRadius:16,padding:"3px 10px",fontSize:11,color:C.orange,fontWeight:700}}>🔥 {totalCal} kcal</div>
            </div>
          </div>
        </div>
      </div>

      {/* Sitting alert banner */}
      {sittingAlert&&isConn&&(
        <div style={{background:"linear-gradient(90deg,#200A00,#2A1000)",borderBottom:`1px solid ${C.orange}`,padding:"9px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",animation:"fadeIn 0.3s"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <IcoZap s={18} c={C.orange}/>
            <span style={{fontSize:13,fontWeight:700,color:C.orange}}>นั่งนิ่ง {Math.floor(sittingMin)} นาที — ⌚ Watch ตรวจพบ! ควรยืดเส้นเพื่อป้องกัน Office Syndrome</span>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn" onClick={()=>setSittingAlert(false)} style={{background:"transparent",color:C.gray,border:"1px solid #333",borderRadius:7,padding:"4px 12px",fontSize:11}}>ข้าม</button>
            <button className="btn" onClick={()=>{setTab("workout");startFull();}} style={{background:gBrand,color:"#000",border:"none",borderRadius:7,padding:"4px 14px",fontSize:11,fontWeight:700}}>ยืดเลย!</button>
          </div>
        </div>
      )}

      {/* ── BODY ── */}
      <div style={{maxWidth:1060,margin:"0 auto",padding:"22px 22px 60px"}}>

        {/* ═══ HOME TAB ═══ */}
        {tab==="home"&&(
          <div style={{display:"flex",flexDirection:"column",gap:18,animation:"slideUp 0.3s"}}>
            {/* Hero greeting */}
            <div style={{background:"linear-gradient(135deg,#1A0008,#200010,#0A0005)",border:"1px solid #3A0A18",borderRadius:20,padding:"24px 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:13,color:"#9A6070",marginBottom:4}}>สวัสดีตอนบ่าย • วันอังคาร 27 ม.ค. 2026</div>
                <div style={{fontSize:26,fontWeight:800,...gRed,marginBottom:6}}>ร่างกายพร้อมรับมือออฟฟิศไหม?</div>
                <div style={{fontSize:13,color:C.lgray,maxWidth:420,lineHeight:1.6}}>
                  วันนี้คุณนั่งมาแล้ว <span style={{color:C.orange,fontWeight:700}}>{Math.floor(sittingMin)} นาที</span> ·
                  ยืดเส้นแล้ว <span style={{color:C.teal,fontWeight:700}}>{totalS} ครั้ง</span> ·
                  Risk Score <span style={{color:postureScore>70?C.teal:C.red,fontWeight:700}}>{Math.round(postureScore)}%</span>
                </div>
              </div>
              <div style={{display:"flex",gap:16,flexShrink:0}}>
                <Ring val={Math.round(postureScore)} size={86} color={postureScore>70?C.teal:C.orange} label={Math.round(postureScore)} sub="Posture"/>
                <Ring val={Math.round(100-stress)} size={86} color={stress<50?C.green:C.red} label={Math.round(100-stress)} sub="Wellness"/>
              </div>
            </div>

            {/* Quick stats row */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12}}>
              {[
                {icon:<IcoHeart s={18}/>,label:"Heart Rate",val:Math.round(dHR),unit:"bpm",color:C.red,bg:"#1A0510"},
                {icon:<IcoActivity s={18} c={C.teal}/>,label:"SpO2",val:Math.round(spo2),unit:"%",color:C.teal,bg:"#051514"},
                {icon:<IcoShield s={18} c={C.blue}/>,label:"HRV",val:Math.round(hrv),unit:"ms",color:C.blue,bg:"#050F20"},
                {icon:<IcoBrain s={18} c={C.pink}/>,label:"ความเครียด",val:Math.round(stress),unit:"%",color:stress<50?C.green:stress<70?C.orange:C.red,bg:"#150510"},
                {icon:<IcoSleep s={18}/>,label:"ก้าวเดินวันนี้",val:stepsToday.toLocaleString(),unit:"ก้าว",color:"#99FFFF",bg:"#051520"},
              ].map((m,i)=>(
                <div key={i} style={{background:m.bg,border:`1px solid ${m.color}25`,borderRadius:14,padding:"16px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:10,color:C.gray,fontWeight:600}}>{m.label}</span>{m.icon}</div>
                  <div style={{fontSize:28,fontWeight:700,color:m.color,lineHeight:1,whiteSpace:"nowrap"}}>{m.val}<span style={{fontSize:11,color:C.gray,marginLeft:3}}>{m.unit}</span></div>
                </div>
              ))}
            </div>

            {/* Office Syndrome Risk + Quick actions */}
            <div style={{display:"grid",gridTemplateColumns:"1.2fr 0.8fr",gap:16}}>
              <Card>
                <SectionTitle icon={<IcoShield s={15} c={C.red}/>} title="Office Syndrome Risk Map" sub="วิเคราะห์จาก Sensor + การใช้งานวันนี้"/>
                {riskAreas.map((r,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:i<riskAreas.length-1?"1px solid #1E1E1E":"none"}}>
                    <span style={{fontSize:18,width:26}}>{r.icon}</span>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:12,color:C.white,fontWeight:600}}>{r.label}</span>
                        <span style={{fontSize:12,fontWeight:700,color:r.pain>70?C.red:r.pain>50?C.orange:C.teal}}>{r.pain}%</span>
                      </div>
                      <PainBar val={r.pain} color={r.pain>70?C.red:r.pain>50?C.orange:C.teal}/>
                    </div>
                    <span style={{fontSize:11,fontWeight:700,color:r.trend<0?C.green:C.red,width:36,textAlign:"right"}}>{r.trend}%</span>
                  </div>
                ))}
              </Card>
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {/* Quick stretch */}
                <div style={{background:"linear-gradient(135deg,#1A0008,#200010)",border:"1px solid #3A0A18",borderRadius:16,padding:18,flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.red,marginBottom:12}}>⚡ Quick Stretch</div>
                  {exercises.slice(0,4).map((e,i)=>(
                    <div key={i} className="btn" onClick={()=>{setTab("workout");startOne(i);}} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",borderRadius:9,marginBottom:4,background:"#1A0010",border:`1px solid ${e.col}25`,cursor:"pointer"}}>
                      <div style={{flexShrink:0}}>{e.svg&&<svg viewBox="0 0 80 80" width="24" height="24">{e.svg.props.children}</svg>}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:600,color:e.col}}>{e.name}</div>
                        <div style={{fontSize:10,color:C.gray}}>{e.fixes}</div>
                      </div>
                      <span style={{fontSize:11,color:C.gray}}>{e.dur}s</span>
                    </div>
                  ))}
                </div>
                {/* Eye & Water */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div className="btn" onClick={startEyeRest} style={{background:eyeActive?"#0D0524":"#100A20",border:`1px solid ${C.purple}40`,borderRadius:12,padding:14,cursor:"pointer",textAlign:"center"}}>
                    <IcoEye s={22} c={C.purple}/>
                    <div style={{fontSize:12,fontWeight:700,color:C.purple,marginTop:6}}>{eyeActive?`${eyeTimer}s`:"พักตา"}</div>
                    <div style={{fontSize:10,color:C.gray}}>20-20-20</div>
                  </div>
                  <div className="btn" onClick={()=>setWaterCount(w=>Math.min(8,w+1))} style={{background:"#050F20",border:`1px solid ${C.blue}40`,borderRadius:12,padding:14,cursor:"pointer",textAlign:"center"}}>
                    <div style={{fontSize:22}}>💧</div>
                    <div style={{fontSize:12,fontWeight:700,color:C.blue,marginTop:6}}>{waterCount}/8</div>
                    <div style={{fontSize:10,color:C.gray}}>แก้วน้ำวันนี้</div>
                  </div>
                </div>
              </div>
            </div>

            {/* Today timeline */}
            <Card>
              <SectionTitle icon={<IcoTrend s={15}/>} title="กิจกรรมวันนี้" sub="Timeline สุขภาพ"/>
              <div style={{display:"flex",gap:0,position:"relative"}}>
                <div style={{position:"absolute",top:16,left:16,right:16,height:2,background:C.surf3}}/>
                {[
                  {time:"09:00",act:"เริ่มงาน",icon:"💻",done:true,color:C.blue},
                  {time:"10:30",act:"ยืดเส้น",icon:"🤸",done:true,color:C.teal},
                  {time:"12:00",act:"พักเที่ยง",icon:"🍱",done:true,color:C.green},
                  {time:"14:00",act:"ดื่มน้ำ",icon:"💧",done:true,color:C.blue},
                  {time:"14:32",act:"ยืดเส้น",icon:"🔔",done:false,color:C.red},
                  {time:"16:00",act:"พักตา",icon:"👁️",done:false,color:C.purple},
                  {time:"17:00",act:"เลิกงาน",icon:"🏠",done:false,color:C.gray},
                ].map((t,i)=>(
                  <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                    <div style={{width:32,height:32,borderRadius:"50%",background:t.done?t.color:C.surf3,border:`2px solid ${t.done?t.color:C.surf3}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,zIndex:1}}>
                      {t.done?t.icon:<span style={{fontSize:12}}>{t.icon}</span>}
                    </div>
                    <div style={{fontSize:10,color:t.done?C.white:C.gray,textAlign:"center"}}>{t.act}</div>
                    <div style={{fontSize:9,color:C.gray}}>{t.time}</div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        )}

        {/* ═══ HEALTH TAB ═══ */}
        {tab==="health"&&(
          <div style={{display:"flex",flexDirection:"column",gap:18,animation:"slideUp 0.3s"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              {/* HR + History */}
              <Card>
                <SectionTitle icon={<IcoHeart s={15}/>} title="Heart Rate Monitor" sub={isConn?"Live จากนาฬิกา":"Simulated"}/>
                <div style={{display:"flex",alignItems:"flex-end",gap:10,marginBottom:16}}>
                  <div style={{fontSize:60,fontWeight:800,...gRed,lineHeight:1,animation:"beat 1s infinite"}}>{Math.round(dHR)}</div>
                  <div style={{paddingBottom:8}}>
                    <div style={{fontSize:14,color:C.gray}}>bpm</div>
                    <div style={{fontSize:12,fontWeight:600,color:dHR<80?C.teal:dHR<100?C.green:dHR<120?C.orange:C.red}}>{dHR<80?"พักผ่อน":dHR<100?"เบาบาง":dHR<120?"ออกกำลัง":"หนัก"}</div>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"flex-end",gap:2,height:48,background:"#1A0010",borderRadius:10,padding:"8px 12px",marginBottom:12}}>
                  {hrHist.slice(-18).map((v,i,a)=>(
                    <div key={i} style={{flex:1,background:i===a.length-1?C.red:`${C.red}${Math.round(25+i*(80/a.length)).toString(16).padStart(2,"0")}`,borderRadius:2,height:`${(v/hrMax)*100}%`,minHeight:2,transition:"height 0.4s"}}/>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                  {[{l:"HRV",v:`${Math.round(hrv)}ms`,c:C.blue},{l:"SpO2",v:`${Math.round(spo2)}%`,c:C.teal},{l:"Stress",v:`${Math.round(stress)}%`,c:stress<50?C.green:C.orange}].map((s,i)=>(
                    <div key={i} style={{background:C.surf2,borderRadius:9,padding:"10px",textAlign:"center"}}>
                      <div style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</div>
                      <div style={{fontSize:10,color:C.gray}}>{s.l}</div>
                    </div>
                  ))}
                </div>
              </Card>

              {/* Office Syndrome Tracker */}
              <Card>
                <SectionTitle icon={<IcoShield s={15} c={C.orange}/>} title="Office Syndrome Tracker" sub="บันทึกอาการรายวัน"/>
                {riskAreas.map((r,i)=>(
                  <div key={i} style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <span style={{fontSize:12,display:"flex",alignItems:"center",gap:6}}>{r.icon}<span style={{color:C.white}}>{r.label}</span></span>

                    <div style={{fontSize:12,color:C.teal,fontWeight:700,display:"flex",alignItems:"center",gap:5,marginBottom:4}}><IcoCheck s={12}/>เชื่อมต่อสำเร็จ</div>
                    <div style={{fontSize:24,fontWeight:700,marginBottom:3}}>{deviceName}</div>
                    <div style={{fontSize:12,color:"#9A6070",marginBottom:16}}>Bluetooth LE · Heart Rate Service 0x180D · GATT</div>
                    <div style={{display:"flex",alignItems:"flex-end",gap:8,height:36,background:"#200010",borderRadius:9,padding:"6px 10px",marginBottom:14}}>
                      {hrHist.slice(-14).map((v,i,a)=>(
                        <div key={i} style={{flex:1,background:i===a.length-1?C.red:`${C.red}${Math.round(20+i*(80/a.length)).toString(16).padStart(2,"0")}`,borderRadius:2,height:`${(v/hrMax)*100}%`,minHeight:2,transition:"height 0.4s"}}/>

                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
                      {[{l:"HR",v:`${Math.round(dHR)} bpm`,c:C.red},{l:"SpO2",v:`${Math.round(spo2)}%`,c:C.teal},{l:"HRV",v:`${Math.round(hrv)}ms`,c:C.blue},{l:"Battery",v:battery!==null?`${battery}%`:"N/A",c:C.orange}].map((r,i)=>(
                        <div key={i} style={{background:"#200010",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                          <div style={{fontSize:16,fontWeight:700,color:r.c}}>{r.v}</div>
                          <div style={{fontSize:10,color:C.gray}}>{r.l}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:10}}>
                      <button className="btn" onClick={()=>{setTab("workout");}} style={{flex:1,background:gBrand,color:"#000",border:"none",borderRadius:11,padding:"11px",fontSize:14,fontWeight:700}}>เริ่ม Workout</button>
                      <button className="btn" onClick={disconnectBLE} style={{background:"transparent",color:C.red,border:"1px solid #E5002F40",borderRadius:11,padding:"11px 18px",fontSize:12}}>ตัดการเชื่อมต่อ</button>
                    </div>
                  </>
                ):(
                  <>
                    <div style={{fontSize:24,fontWeight:800,...gRed,marginBottom:8}}>เชื่อมต่อ Smart Watch</div>
                    <div style={{fontSize:13,color:"#9A6070",marginBottom:20,lineHeight:1.7}}>HeartStretch ใช้ Web Bluetooth API รับข้อมูล Heart Rate, SpO2, HRV แบบ Real-time เพื่อวิเคราะห์และป้องกัน Office Syndrome ตรงจุด</div>
                    {bleState===BLE.ERROR&&<div style={{background:"#200005",border:"1px solid #E5002F40",borderRadius:9,padding:"9px 12px",marginBottom:12,fontSize:12,color:C.red,display:"flex",alignItems:"center",gap:6}}><IcoX s={12}/>{bleError}</div>}
                    {bleState===BLE.UNSUPPORTED&&<div style={{background:"#201000",border:`1px solid ${C.orange}40`,borderRadius:9,padding:"9px 12px",marginBottom:12,fontSize:12,color:C.orange}}>⚠️ ใช้ Chrome หรือ Edge บน Desktop/Android</div>}
                    <button className="btn" onClick={connectBLE} disabled={bleState===BLE.SCANNING||bleState===BLE.CONNECTING}
                      style={{display:"flex",alignItems:"center",gap:8,background:bleState===BLE.SCANNING||bleState===BLE.CONNECTING?C.surf3:gBrand,color:bleState===BLE.SCANNING||bleState===BLE.CONNECTING?C.gray:"#fff",border:"none",borderRadius:12,padding:"13px 32px",fontSize:15,fontWeight:700,marginBottom:10}}>
                      <IcoBT s={18} c={bleState===BLE.SCANNING||bleState===BLE.CONNECTING?C.gray:"#fff"}/>
                      {bleState===BLE.SCANNING?"กำลังสแกน...":bleState===BLE.CONNECTING?"กำลังเชื่อมต่อ...":"เชื่อมต่อ Smart Watch"}
                    </button>
                    <button className="btn" onClick={()=>setTab("workout")} style={{background:"transparent",color:C.gray,border:"1px solid #333",borderRadius:10,padding:"9px 22px",fontSize:12}}>ลอง Demo Mode</button>
                  </>
                )}
              </div>
            </div>
            {/* Supported devices */}
            <Card>
              <SectionTitle icon={<IcoWatch s={15}/>} title="นาฬิกาที่รองรับ" sub="Bluetooth LE Heart Rate Service (GATT 0x180D)"/>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
                {[
                  {name:"Xiaomi / Amazfit",sub:"แนะนำสำหรับ Pilot",col:"#FF6B6B",badge:"BEST VALUE"},
                  {name:"Samsung Galaxy Watch",sub:"Wear OS · Health",col:C.blue,badge:""},
                  {name:"Apple Watch",sub:"iOS Native App",col:C.gray,badge:""},
                  {name:"Fitbit Charge 5/6",sub:"Fitbit Web API",col:C.green,badge:""},
                  {name:"Polar H10 HR Strap",sub:"BLE · HR Only",col:C.orange,badge:"HR Only"},
                ].map((w,i)=>(
                  <div key={i} style={{background:`${w.col}10`,border:`1px solid ${w.col}25`,borderRadius:12,padding:"14px 10px",textAlign:"center"}}>
                    <IcoWatch s={22} c={w.col}/>
                    <div style={{fontSize:11,fontWeight:700,color:w.col,marginTop:7,marginBottom:3}}>{w.name}</div>
                    <div style={{fontSize:9,color:C.gray,marginBottom:w.badge?6:0}}>{w.sub}</div>
                    {w.badge&&<div style={{background:w.col,color:"#000",fontSize:8,fontWeight:700,borderRadius:3,padding:"1px 5px",display:"inline-block"}}>{w.badge}</div>}
                  </div>
                ))}
              </div>
            </Card>
          </div>

        {tab==="social"&&(

                  <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 10px",marginBottom:3,borderRadius:10,background:p.name==="คุณ"?"linear-gradient(90deg,#200008,#180006)":"transparent",border:p.name==="คุณ"?"1px solid #E5002F30":"1px solid transparent"}}>

                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:p.name==="คุณ"?700:500,color:p.name==="คุณ"?C.red:C.white}}>{p.name}</div>
                      <div style={{fontSize:10,color:C.gray}}>🔥 {p.st} วัน streak</div>
                    </div>
                    <div style={{fontSize:18,fontWeight:700,color:i===0?C.yellow:i===1?"#C0C0C0":i===2?C.orange:C.white,whiteSpace:"nowrap"}}>{p.pts.toLocaleString()}</div>
                  </div>
                ))}
              </Card>
              <Card>
                <SectionTitle icon={<IcoZap s={15} c={C.yellow}/>} title="HeartStretch Badges" sub="ความสำเร็จในการป้องกัน Office Syndrome"/>
                {[
                  {name:"First Beat",desc:"ยืดเส้นครั้งแรก",unlocked:totalS>=1,icon:"💗",col:C.red},
                  {name:"Watch Sync",desc:"เชื่อมต่อ Smart Watch",unlocked:isConn,icon:"⌚",col:C.teal},
                  {name:"Desk Warrior",desc:"ยืดทุกวัน 7 วันติด",unlocked:totalS>=3,icon:"⚔️",col:C.blue},
                  {name:"Pain Slayer",desc:"ลดอาการปวด Office Syndrome 20%",unlocked:totalS>=5,icon:"🛡️",col:C.green},
                  {name:"HR Zone Pro",desc:"HR อยู่ใน Zone ครบ 20 ครั้ง",unlocked:false,icon:"🎯",col:C.orange},
                  {name:"Office Legend",desc:"ยืดเส้นครบ 200 ครั้ง",unlocked:false,icon:"👑",col:C.yellow},
                ].map((a,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"8px 0",borderBottom:i<5?"1px solid #1E1E1E":"none",opacity:a.unlocked?1:0.35}}>
                    <div style={{width:36,height:36,borderRadius:10,background:a.unlocked?`${a.col}20`:"#1A1A1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{a.icon}</div>
                    <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:a.unlocked?a.col:C.gray}}>{a.name}</div><div style={{fontSize:10,color:C.gray}}>{a.desc}</div></div>
                    {a.unlocked&&<div style={{fontSize:9,color:C.green,fontWeight:700,background:"#051A0F",borderRadius:5,padding:"1px 6px"}}>✓</div>}
                  </div>
                ))}
              </Card>
            </div>
            {/* Team challenge */}
            <div style={{background:"linear-gradient(135deg,#12072A,#0D1030)",border:`1px solid ${C.purple}40`,borderRadius:16,padding:22}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:4,color:C.purple,display:"flex",alignItems:"center",gap:7}}><IcoUsers s={15} c={C.purple}/>Team Office Syndrome Challenge — ม.ค. 2026</div>
              <div style={{fontSize:12,color:C.gray,marginBottom:18}}>ทีมไหนยืดเส้นมากที่สุดและลด Office Syndrome Risk Score ได้ดีที่สุดชนะ!</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
                {[{t:"ทีม Alpha",pts:4820,m:8,pct:100,col:C.yellow,rank:"🥇",you:false},{t:"ทีม Beta",pts:4650,m:7,pct:96,col:C.red,rank:"🥈",you:true},{t:"ทีม Gamma",pts:4210,m:9,pct:87,col:C.teal,rank:"🥉",you:false}].map((t,i)=>(
                  <div key={i} style={{background:C.surf3,borderRadius:13,padding:18,border:t.you?"1px solid #E5002F":"none",position:"relative"}}>
                    {t.you&&<div style={{position:"absolute",top:9,right:9,fontSize:9,background:C.red,color:"#fff",borderRadius:4,padding:"1px 5px",fontWeight:700}}>คุณ</div>}
                    <div style={{fontSize:26,marginBottom:5}}>{t.rank}</div>
                    <div style={{fontSize:15,fontWeight:700,color:t.col,marginBottom:3}}>{t.t}</div>
                    <div style={{fontSize:11,color:C.gray,marginBottom:10}}>{t.m} สมาชิก</div>
                    <div style={{fontSize:30,fontWeight:700,color:C.white,whiteSpace:"nowrap"}}>{t.pts.toLocaleString()}</div>
                    <div style={{fontSize:10,color:C.gray,marginBottom:8}}>คะแนนรวม</div>
                    <div style={{background:C.surf,borderRadius:4,height:6}}><div style={{background:t.col,height:6,borderRadius:4,width:`${t.pct}%`}}/></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
